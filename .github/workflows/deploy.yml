name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test project images
        run: node --test scripts/projects.test.mjs
      - name: Check public artifact
        run: node scripts/check-public-artifact.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages publishing source
        run: node scripts/check-pages-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload dist only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout verification scripts
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published HTML and asset MIME types
        run: node scripts/verify-public-site.mjs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
